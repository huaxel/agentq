name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: |
          fixture_home="$(mktemp -d)"
          trap 'rm -rf "$fixture_home"' EXIT
          cp -R testdata/home/. "$fixture_home/"
          AGENTQ_HOME="$fixture_home" AGENTQ_FIXTURE_HOME="$fixture_home" npm run ci
